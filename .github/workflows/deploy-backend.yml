name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

env:
  GCP_REGION: us-central1
  SERVICE_NAME: verity-backend
  REPO_NAME: verity-backend
  IMAGE_NAME: api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: backend
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Write env vars file
        run: |
          cat > /tmp/env-vars.yaml <<EOF
          VERITY_ENV: "development"
          VERITY_PROVIDER: "nebius"
          VERITY_CORS_ORIGINS: "http://localhost:3000,https://verity-frontend-mu.vercel.app"
          VERITY_TOOL_BACKEND: "nebius_sandbox"
          LLM_API_KEY: "${{ secrets.LLM_API_KEY }}"
          TAVILY_API_KEY: "${{ secrets.TAVILY_API_KEY }}"
          SERPER_API_KEY: "${{ secrets.SERPER_API_KEY }}"
          SANDBOX_PROJECT_ID: "${{ secrets.SANDBOX_PROJECT_ID }}"
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SECRET_KEY: "${{ secrets.SUPABASE_SECRET_KEY }}"
          SUPABASE_PUBLISHABLE_KEY: "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="$IMAGE" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=2 \
            --env-vars-file=/tmp/env-vars.yaml
          rm -f /tmp/env-vars.yaml
