# Verity backend configuration. Every budget, limit, timeout, model route and price lives here.
# Env overrides: VERITY_<KEY> for top-level keys, VERITY_<TABLE>__<KEY> for tables
# (for example VERITY_BUDGET__RUN__MAX_USD=0.30). Named env vars (LLM_BASE_URL, LLM_API_KEY,
# LLM_MODEL_ULTRA, LLM_MODEL_SUPER, SANDBOX_API_KEY, SANDBOX_BASE_URL) map onto [llm] and [tools.nebius_sandbox].
# No secrets in this file. Ever.
# Sources: backend/ARCHITECTURE.md sections 12.2, 12.4, 18.3, 19, 20, 21.

env = "development"            # development | production | test   (VERITY_ENV)
provider = "fake"              # fake | nebius | openai_compat       (VERITY_PROVIDER)
tool_backend = "local_docker"  # local_docker | nebius_sandbox       (VERITY_TOOL_BACKEND)
data_dir = "data"              # relative paths resolve against this file's folder
tasks_dir = "tasks"
cors_origins = "http://localhost:3000"   # comma separated              (VERITY_CORS_ORIGINS)

[server]
host = "127.0.0.1"
port = 8000

[llm]
base_url = "https://api.tokenfactory.nebius.com/v1"
model_ultra = "nvidia/Nemotron-3-Ultra-550b-a55b"
model_super = "nvidia/nemotron-3-super-120b-a12b"
retries = 2                    # on 429 / 5xx, with backoff
backoff_s = 2.0
cache_responses = false        # cache by (prompt hash, model, params); dev and evals only
production_host = "api.tokenfactory.nebius.com"

# Role routes (ARCHITECTURE 17). tier: ultra | super
[routes.planner]
tier = "ultra"
temperature = 0.2

[routes.rtl_gen]
tier = "ultra"
temperature = 0.2

[routes.repair]
tier = "ultra"
temperature = 0.1

[routes.optimizer]
tier = "super"
temperature = 0.6

# USD per 1M tokens (ARCHITECTURE 20, Nebius catalog 2026-10-05). Unknown models use [prices.fallback].
[prices."nvidia/Nemotron-3-Ultra-550b-a55b"]
input_per_m = 1.00
output_per_m = 3.00

[prices."nvidia/nemotron-3-super-120b-a12b"]
input_per_m = 0.30
output_per_m = 0.90

[prices.fallback]
input_per_m = 1.00
output_per_m = 3.00

[budget.run]
max_llm_calls = 20
max_input_tokens = 150_000
max_output_tokens = 200_000    # includes reasoning tokens; a real mac4 run uses 35k to 60k, so max_usd is the binding cap
max_usd = 0.50                 # per-run cap; also the capUsd sent to the web app
max_candidates = 6             # v1 + 3 (round 1) + 2 (round 2)
max_repairs_baseline = 2
max_repairs_child = 1
max_rounds = 2
max_wall_s = 900

[budget.call]
plan_max_output = 12_000       # Nemotron reasoning tokens count against this cap; 1_500, 4_000 and 6_000 cut real plans off (matmul4)
rtl_max_output = 24_000        # 12_000 cut 11 of 20 matmul4 drafts and 6 repair/optimizer calls at the cap (2026-10-16 gate)
max_prompt_tokens = 12_000

[limits]
auth_per_ip = 10               # POST /auth/session per IP ...
auth_window_s = 600            # ... per 10 min
api_per_session_per_min = 60
runs_per_session_per_hour = 3
concurrent_per_session = 1
concurrent_global = 2
daily_usd = 5.00               # global estimated spend per UTC day, persisted in SQLite
default_mode = "full"          # fast | full

[timeouts]
lint_s = 20
sim_s = 60
synth_s = 120
sta_s = 60
eqy_s = 180
sandbox_overhead_s = 15        # added to the outer timeout of each sandbox call (start-up, copy)
llm_ultra_s = 120
llm_super_s = 120               # a 12_000 token Super call already took 59 s

[auth]
required = false               # false = anonymous sessions keyed by client IP (dev, and until frontend/ sends tokens).
                               # The production guard refuses to start with required = false.
session_ttl_s = 43_200         # 12 h
stream_ttl_s = 1_800           # 30 min

[sse]
ping_s = 15
max_event_bytes = 65_536

[watchdog]
interval_s = 30
stall_s = 90
heartbeat_s = 10

[plan]
gate_auto_continue_ms = 10_000
gate_after_replan_ms = 6_000
max_hold_s = 120               # a held gate auto-continues after this
max_replans = 1
max_blocks = 8
json_retries = 1

[rtl]
max_bytes = 20_000

[baseline]
samples = 3                    # R4: v1 first attempts sampled in parallel; only the best is repaired (1 turns it off)
temperature = 1.0              # Nemotron card recommendation, for the samples only
top_p = 0.95

[evolution]
round1_children = 3
round1_strategies = ["SIMPLIFY", "OPTIMIZE", "EXPLORE"]
round2_children = 2
elites = 2
round2_requires_improvement = true
max_prove_attempts = 2

[tools]
image = "verity-tools:0.1"
docker_bin = "docker"
docker_user = "1000:1000"      # "" runs the container as the image default user (try it if /work is not writable on Docker Desktop)
memory = "2g"
cpus = "2"
pids_limit = 256
output_cap_bytes = 65_536
infra_retries = 1              # sandbox retries on infrastructure errors only, never on a test failure

[tools.nebius_sandbox]
base_url = ""                  # SANDBOX_BASE_URL. UNVERIFIED: confirm the Sandboxes endpoint on day 1 (M0).
image_ref = ""                 # registry reference of the imported tool image
